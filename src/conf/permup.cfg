adm: {
    mode: darklist
    list: {}
    except: {}
    blocked_users: {}
    allowed_users: {}
}

dev: {
    mode: whitelist
    list: {
        docker,
        systemctl,
        journalctl
    }
    except: {
        docker run --privileged,
        systemctl disable
    }
    allowed_users: {
        marek,
        ola
    }
}